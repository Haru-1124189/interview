const MASTER_AT = 2, PASS_PCT = 95, KEY = "jasm_progress_v3";
const C = { bg:"#0c1018", surface:"#161c28", surface2:"#1e2533", border:"#2a3340", text:"#e8eaed", muted:"#8794a6", accent:"#d98e5a", success:"#5fb487", successBg:"#16241d", error:"#d96b6b", errorBg:"#241616" };
const $ = (sel, el=document) => el.querySelector(sel);
const app = $("#app");
const shuffle = (a) => { const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; };
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const buildOpts = (t) => shuffle([t, ...shuffle(VOCAB.filter(v=>v.en!==t.en)).slice(0,3)]);
const catLabel = (id) => (CATS.find(c=>c.id===id)||{}).label || id;

// ---- progress ----
let progress = { vocab:{}, sentence:{}, weak:[] };
function load(){ try{ const r=localStorage.getItem(KEY); if(r){const p=JSON.parse(r); progress={vocab:p.vocab||{},sentence:p.sentence||{},weak:p.weak||[]};} }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }
function markVocab(en, correct){ const cur=progress.vocab[en]||{seen:0,correct:0}; progress.vocab[en]={seen:cur.seen+1, correct:cur.correct+(correct?1:0)}; save(); }
function markSentence(en, status){ progress.sentence[en]=status; save(); }
function vocabMastered(){ return VOCAB.filter(v=>(progress.vocab[v.en]?.correct||0)>=MASTER_AT).length; }
function sentenceKnown(){ return SENTENCES.filter(s=>progress.sentence[s.en]==="known").length; }

function highlight(sentence, term){
  const words = term.toLowerCase().replace(/[.,]/g,"").split(/\s+/).filter(w=>w.length>2);
  if(!words.length) return esc(sentence);
  return sentence.split(/(\s+)/).map(tok=>{
    const bare=tok.toLowerCase().replace(/[.,:;]/g,"");
    const hit=words.some(w=>bare===w||bare.startsWith(w)||(w.startsWith(bare)&&bare.length>3));
    return hit?`<b style="color:${C.accent}">${esc(tok)}</b>`:esc(tok);
  }).join("");
}

// ============ ROUTER ============
let view="home", state={};
function go(v, s={}){ view=v; state=s; render(); window.scrollTo(0,0); }

function render(){
  if(view==="home") return renderHome();
  if(view==="practice") return renderPractice();
  if(view==="test") return renderTest();
  if(view==="weak") return renderWeak();
  if(view==="sentence") return renderSentence();
}

// ============ HOME ============
function renderHome(){
  const vM=vocabMastered(), sK=sentenceKnown();
  const vPct=Math.round(vM/VOCAB.length*100), sPct=Math.round(sK/SENTENCES.length*100);
  const overall=Math.round((vM+sK)/(VOCAB.length+SENTENCES.length)*100);
  const wc=progress.weak.length;
  app.innerHTML = `
    <div style="padding-top:24px">
      <div class="mono" style="font-size:11px;letter-spacing:2px;color:${C.accent};margin-bottom:4px">JASM · CMP · INTERVIEW</div>
      <h1 style="font-size:25px;font-weight:800;letter-spacing:-.5px;margin:0 0 2px">面接 英語トレーナー</h1>
      <div style="color:${C.muted};font-size:13px;margin-bottom:20px">単語 ${VOCAB.length} ・ 英文 ${SENTENCES.length}</div>
      <div style="display:flex;justify-content:center;margin:4px 0 24px">${wafer(overall)}</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${modeCard("practice","単語 練習","日本語→英語を4択。間違えたら再出題、2回正解で習得",`${vM} / ${VOCAB.length} 習得`,vPct)}
        ${modeCard("test","単語 テスト",`問題数を選んで採点。${PASS_PCT}%以上で合格`,"ランダム / グループ別",null)}
        ${modeCard("weak","弱点 復習","テストで間違えた単語だけ集中練習", wc>0?`${wc} 語たまっている`:"今は空です",null,wc===0)}
        ${modeCard("sentence","英文 並び替え","意味を見て、かたまりを正しい順にタップ",`${sK} / ${SENTENCES.length} 正解`,sPct)}
      </div>
      <div style="margin-top:16px;text-align:center">
        <button id="resetBtn" class="link">進捗をリセット</button>
      </div>
    </div>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $("#resetBtn").onclick=()=>{
    $("#resetBtn").outerHTML=`<span style="font-size:12px;color:${C.muted}">本当に消す？ <button id="yes" class="link" style="color:${C.error};font-weight:700">はい</button> <button id="no" class="link" style="color:${C.text}">戻る</button></span>`;
    $("#yes").onclick=()=>{ progress={vocab:{},sentence:{},weak:[]}; save(); render(); };
    $("#no").onclick=()=>render();
  };
}
function wafer(pct){
  const size=150,sw=9,r=(size-sw)/2,c=2*Math.PI*r,off=c-(pct/100)*c;
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${C.surface2}" stroke-width="${sw}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${C.accent}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" style="transition:stroke-dashoffset .6s"/>
      <circle cx="${size/2}" cy="${sw/2+1}" r="3.5" fill="${C.bg}" stroke="${C.border}"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="mono" style="font-size:36px;font-weight:800;line-height:1">${pct}<span style="font-size:16px;color:${C.muted}">%</span></div>
      <div style="font-size:10px;color:${C.muted};letter-spacing:1.5px;margin-top:4px">全体の習得度</div>
    </div></div>`;
}
function modeCard(go,title,sub,stat,pct,dim){
  return `<button data-go="${go}" class="card" style="opacity:${dim?.55:1}">
    <div class="icon">${title.includes("練習")?"A":title.includes("テスト")?"T":title.includes("弱点")?"!":"⇅"}</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:17px;font-weight:700">${title}</div>
      <div style="font-size:12px;color:${C.muted};margin-bottom:${pct!=null?7:4}px">${sub}</div>
      ${pct!=null?`<div class="bar"><div style="width:${pct}%"></div></div>`:""}
      <div class="mono" style="font-size:11px;color:${C.muted};margin-top:5px">${stat}</div>
    </div>
    <div style="color:${C.muted}">›</div>
  </button>`;
}

// ============ shared quiz card ============
function quizCardHTML(item, opts, picked){
  let optHTML = opts.map(o=>{
    let bg=C.surface,bd=C.border,col=C.text;
    if(picked){ if(o.en===item.en){bg=C.successBg;bd=C.success;col=C.success;} else if(o.en===picked.en){bg=C.errorBg;bd=C.error;col=C.error;} else col=C.muted; }
    const reading = (picked && o.en===item.en && READINGS[o.en]) ? `<span style="display:block;font-size:12px;color:${C.success};margin-top:4px;font-weight:500">${esc(READINGS[o.en])}</span>` : "";
    const mark = picked&&o.en===item.en?`<span style="color:${C.success};flex-shrink:0">✓</span>`:(picked&&o.en===picked.en&&o.en!==item.en?`<span style="color:${C.error};flex-shrink:0">✕</span>`:"");
    return `<button class="opt" data-en="${esc(o.en)}" ${picked?"disabled":""} style="background:${bg};border:1.5px solid ${bd};color:${col}">
      <span style="min-width:0"><span class="mono" style="display:block">${esc(o.en)}</span>${reading}</span>${mark}</button>`;
  }).join("");
  let ex="";
  if(picked && EXAMPLES[item.en]){
    ex=`<div style="margin-top:14px;background:${C.surface};border:1px solid ${C.border};border-radius:14px;padding:14px 16px">
      <div style="font-size:10px;color:${C.accent};letter-spacing:1.5px;margin-bottom:8px">この単語を使った文</div>
      <div class="mono" style="font-size:14px;line-height:1.6;color:${C.text};margin-bottom:8px">${highlight(EXAMPLES[item.en].en, item.en)}</div>
      <div style="font-size:13px;line-height:1.6;color:${C.muted}">${esc(EXAMPLES[item.en].jp)}</div></div>`;
  }
  return `<div style="background:${C.surface};border:1px solid ${C.border};border-radius:18px;padding:30px 20px;text-align:center;margin-bottom:18px">
      <div style="font-size:11px;color:${C.muted};letter-spacing:1.5px;margin-bottom:12px">この日本語を英語で？</div>
      <div style="font-size:23px;font-weight:700;line-height:1.4">${esc(item.jp)}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">${optHTML}</div>${ex}`;
}

  const s=state;
  if(!s.started){
    app.innerHTML = topBar("単語 練習") + `
      ${s.result?resultCard(Math.round(s.result.score/s.result.done*100),[`正解 ${s.result.score} / ${s.result.done}`]):""}
      ${sectionLabel("出題範囲")}
      <div class="chips" id="chips">
        ${chip("all", `全部 (${VOCAB.length})`, (s.cat||"all")==="all")}
        ${CATS.map(c=>chip(c.id, `${c.label} (${VOCAB.filter(v=>v.cat===c.id).length})`, s.cat===c.id)).join("")}
      </div>
      ${bigBtn("startBtn", `スタート（${poolBy(s.cat).length}問）`)}`;
    bindBack(); bindChips(s, "cat");
    $("#startBtn").onclick=()=>{ const q=shuffle(poolBy(s.cat)); go("practice",{started:true,cat:s.cat,queue:q,idx:0,opts:buildOpts(q[0]),picked:null,score:0,streak:0,done:0}); };
    return;
  }
  const cur=s.queue[s.idx];
  app.innerHTML = topBar("単語 練習") +
    statRow(`${s.idx+1} / ${s.queue.length}`, `正解 <span style="color:${C.success}">${s.score}</span>　連続 <span style="color:${C.accent}">${s.streak}🔥</span>`) +
    quizCardHTML(cur, s.opts, s.picked) +
    (s.picked?`<div style="margin-top:18px">${bigBtn("nextBtn", s.idx+1>=s.queue.length?"結果を見る":"次へ")}</div>`:"");
  bindBack();
  if(!s.picked){ app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=s.queue.find(x=>x.en===b.dataset.en)||VOCAB.find(x=>x.en===b.dataset.en);
    const correct=b.dataset.en===cur.en; markVocab(cur.en,correct);
    s.picked={en:b.dataset.en}; s.done++;
    if(correct){s.score++;s.streak++;} else {s.streak=0; s.queue.push(cur);}
    go("practice",s);
  }); }
  else { $("#nextBtn").onclick=()=>{ const ni=s.idx+1; if(ni>=s.queue.length){ go("practice",{started:false,cat:s.cat,result:{score:s.score,done:s.done}}); return;} s.idx=ni; s.opts=buildOpts(s.queue[ni]); s.picked=null; go("practice",s); }; }
}

// ============ TEST ============
function renderTest(){
  const s=state;
  if(!s.phase) s.phase="setup";
  if(s.phase==="setup"){
    const cat=s.cat||"all", pool=poolBy(cat);
    const counts=[10,50,100].filter(n=>n<pool.length).concat([pool.length]);
    let count=s.count||10; if(count>pool.length) count=pool.length;
    app.innerHTML = topBar("単語 テスト") + `
      <div style="background:${C.surface};border:1px solid ${C.border};border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:12px;color:${C.muted};line-height:1.6">
        間違えても再出題されません。最後に採点し、<span style="color:${C.accent}">${PASS_PCT}%以上で合格</span>。間違えた単語は弱点に記録されます。</div>
      ${sectionLabel("範囲")}
      <div class="chips">${chip("all",`ランダム全体 (${VOCAB.length})`,cat==="all")}${CATS.map(c=>chip(c.id,`${c.label} (${VOCAB.filter(v=>v.cat===c.id).length})`,cat===c.id)).join("")}</div>
      ${sectionLabel("問題数")}
      <div class="chips" id="countChips">${counts.map(n=>`<button class="chip ${count===n?'on':''}" data-n="${n}">${n>=pool.length?`全部 (${pool.length})`:n+"問"}</button>`).join("")}</div>
      ${bigBtn("startBtn",`テスト開始（${Math.min(count,pool.length)}問）`)}`;
    bindBack();
    app.querySelectorAll(".chips [data-cat]").forEach(b=>b.onclick=()=>{ s.cat=b.dataset.cat; s.count=10; go("test",s); });
    $("#countChips").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ s.count=+b.dataset.n; go("test",s); });
    $("#startBtn").onclick=()=>{ const n=Math.min(count,pool.length); const q=shuffle(pool).slice(0,n); go("test",{phase:"run",cat,count,queue:q,idx:0,opts:buildOpts(q[0]),picked:null,score:0,wrong:[]}); };
    return;
  }
  if(s.phase==="result"){
    const pct=Math.round(s.score/s.queue.length*100), pass=pct>=PASS_PCT;
    app.innerHTML = topBar("テスト結果") + `
      <div style="background:${pass?C.successBg:C.errorBg};border:1.5px solid ${pass?C.success:C.error};border-radius:18px;padding:24px;text-align:center;margin-bottom:16px">
        <div style="font-size:13px;letter-spacing:2px;font-weight:800;color:${pass?C.success:C.error}">${pass?"合格 PASS":"不合格 FAIL"}</div>
        <div class="mono" style="font-size:46px;font-weight:800;margin:6px 0;color:${pass?C.success:C.error}">${pct}%</div>
        <div style="font-size:13px;color:${C.muted}">正解 ${s.score} / ${s.queue.length} ・ 合格ライン ${PASS_PCT}%</div></div>
      ${s.wrong.length?`<div style="background:${C.surface};border:1px solid ${C.border};border-radius:16px;padding:16px;margin-bottom:16px">
        <div style="font-size:12px;color:${C.error};font-weight:700;margin-bottom:10px">間違えた ${s.wrong.length} 語（弱点に追加済み）</div>
        ${s.wrong.map(w=>`<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;padding-bottom:8px;border-bottom:1px solid ${C.border}">
          <span style="color:${C.muted}">${esc(w.jp)}</span>
          <span style="text-align:right"><span class="mono" style="color:${C.text};display:block">${esc(w.en)}</span>${READINGS[w.en]?`<span style="font-size:11px;color:${C.muted}">${esc(READINGS[w.en])}</span>`:""}</span></div>`).join("")}
        </div>`:""}
      <div style="display:flex;gap:10px">
        <button id="homeBtn" class="btn2">ホーム</button>
        <button id="againBtn" class="btn1">↺ もう一度</button></div>`;
    bindBack();
    $("#homeBtn").onclick=()=>go("home");
    $("#againBtn").onclick=()=>go("test",{phase:"setup",cat:s.cat,count:s.count});
    return;
  }
  // run
  const cur=s.queue[s.idx];
  app.innerHTML = topBar("単語 テスト") +
    `<div class="bar" style="margin-bottom:14px"><div style="width:${s.idx/s.queue.length*100}%"></div></div>` +
    statRow(`${s.idx+1} / ${s.queue.length}`, `正解 <span style="color:${C.success}">${s.score}</span>`) +
    quizCardHTML(cur, s.opts, s.picked) +
    (s.picked?`<div style="margin-top:18px">${bigBtn("nextBtn", s.idx+1>=s.queue.length?"採点する":"次へ")}</div>`:"");
  bindBack();
  if(!s.picked){ app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const correct=b.dataset.en===cur.en; markVocab(cur.en,correct);
    s.picked={en:b.dataset.en}; if(correct)s.score++; else s.wrong.push(cur); go("test",s);
  }); }
  else { $("#nextBtn").onclick=()=>{ const ni=s.idx+1; if(ni>=s.queue.length){ const ex=new Set(progress.weak.map(x=>x.en)); progress.weak=[...progress.weak,...s.wrong.filter(w=>!ex.has(w.en))]; save(); go("test",{phase:"result",cat:s.cat,count:s.count,queue:s.queue,score:s.score,wrong:s.wrong}); return;} s.idx=ni; s.opts=buildOpts(s.queue[ni]); s.picked=null; go("test",s); }; }
}

// ============ WEAK ============
function renderWeak(){
  const s=state, weak=progress.weak;
  if(weak.length===0){ app.innerHTML=topBar("弱点 復習")+`<div style="background:${C.surface};border:1px solid ${C.border};border-radius:16px;padding:40px 20px;text-align:center;color:${C.muted}"><div style="font-size:28px;color:${C.success};margin-bottom:8px">✓</div><div style="font-size:15px;font-weight:700;color:${C.text};margin-bottom:6px">弱点はありません</div><div style="font-size:13px">テストで間違えた単語が、ここに集まります。</div></div>`; bindBack(); return; }
  if(!s.started){
    app.innerHTML=topBar("弱点 復習")+`
      <div style="background:${C.surface};border:1px solid ${C.border};border-radius:16px;padding:16px;margin-bottom:18px">
        <div style="font-size:12px;color:${C.muted};margin-bottom:12px">たまっている弱点 ${weak.length} 語。正解できたら弱点から外れます。</div>
        <div style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto">
        ${weak.map(w=>`<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;padding-bottom:8px;border-bottom:1px solid ${C.border}"><span style="color:${C.muted}">${esc(w.jp)}</span><span style="text-align:right"><span class="mono" style="color:${C.text};display:block">${esc(w.en)}</span>${READINGS[w.en]?`<span style="font-size:11px;color:${C.muted}">${esc(READINGS[w.en])}</span>`:""}</span></div>`).join("")}
        </div></div>
      ${bigBtn("startBtn",`弱点を復習（${weak.length}語）`)}`;
    bindBack();
    $("#startBtn").onclick=()=>{ const q=shuffle(weak); go("weak",{started:true,queue:q,idx:0,opts:buildOpts(q[0]),picked:null,cleared:[]}); };
    return;
  }
  const cur=s.queue[s.idx];
  app.innerHTML=topBar("弱点 復習")+statRow(`${s.idx+1} / ${s.queue.length}`,`クリア ${s.cleared.length}`)+quizCardHTML(cur,s.opts,s.picked)+(s.picked?`<div style="margin-top:18px">${bigBtn("nextBtn",s.idx+1>=s.queue.length?"終了する":"次へ")}</div>`:"");
  bindBack();
  if(!s.picked){ app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const correct=b.dataset.en===cur.en; markVocab(cur.en,correct); s.picked={en:b.dataset.en}; if(correct)s.cleared.push(cur.en); else s.queue.push(cur); go("weak",s); }); }
  else { $("#nextBtn").onclick=()=>{ const ni=s.idx+1; if(ni>=s.queue.length){ progress.weak=weak.filter(w=>!s.cleared.includes(w.en)); save(); go("weak",{started:false}); return;} s.idx=ni; s.opts=buildOpts(s.queue[ni]); s.picked=null; go("weak",s); }; }
}

// ============ SENTENCE ============
function qList(){ const seen=new Set(),out=[]; SENTENCES.forEach(s=>{if(!seen.has(s.q)){seen.add(s.q);out.push(s.q);}}); return out; }
function poolByQ(q){ return q==="all"||!q?SENTENCES:SENTENCES.filter(s=>s.q===q); }
function renderSentence(){
  const s=state;
  if(!s.started){
    const qf=s.qf||"all";
    app.innerHTML=topBar("英文 並び替え")+`
      <div style="background:${C.surface};border:1px solid ${C.border};border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:12px;color:${C.muted};line-height:1.6">日本語の意味を見て、英語の<span style="color:${C.accent}">かたまりを正しい順にタップ</span>。全部正しく並べば「正解」に記録されます。</div>
      ${sectionLabel("範囲（質問ごと）")}
      <div class="chips">${chipQ("all",`全部 (${SENTENCES.length})`,qf==="all")}${qList().map(q=>{const n=SENTENCES.filter(x=>x.q===q).length;const k=SENTENCES.filter(x=>x.q===q&&progress.sentence[x.en]==="known").length;return chipQ(q,`${q} ${k}/${n}`,qf===q);}).join("")}</div>
      ${bigBtn("startBtn",`スタート（${poolByQ(qf).length}問）`)}`;
    bindBack();
    app.querySelectorAll("[data-qf]").forEach(b=>b.onclick=()=>{ s.qf=b.dataset.qf; go("sentence",s); });
    $("#startBtn").onclick=()=>{ const cards=poolByQ(qf); go("sentence",setupCard({started:true,qf,cards,idx:0})); };
    return;
  }
  const cur=s.cards[s.idx];
  app.innerHTML=topBar("英文 並び替え")+statRow(`${s.idx+1} / ${s.cards.length}`,`<span style="color:${C.accent}">${esc(cur.q)}</span>`)+`
    <div style="background:${C.surface};border:1px solid ${C.border};border-radius:16px;padding:16px 18px;margin-bottom:14px">
      <div style="font-size:11px;color:${C.muted};letter-spacing:1.5px;margin-bottom:8px">この意味の英文を組み立てる</div>
      <div style="font-size:17px;font-weight:600;line-height:1.6">${esc(cur.jp)}</div></div>
    <div id="slots" style="min-height:64px;background:${C.bg};border:1.5px solid ${s.checked?(s.correct?C.success:C.error):C.border};border-radius:14px;padding:10px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start">
      ${s.slots.length===0?`<div style="color:${C.muted};font-size:13px;padding:10px 6px">下のかたまりをタップ</div>`:s.slots.map((c,i)=>{
        let bg=C.surface2,bd=C.accent,col=C.text; if(s.checked){const ok=c.key===String(i); bg=ok?C.successBg:C.errorBg; bd=ok?C.success:C.error; col=ok?C.success:C.error;}
        return `<button class="slot mono" data-k="${c.key}" ${s.checked?"disabled":""} style="background:${bg};border:1px solid ${bd};color:${col}">${esc(c.text)}</button>`;
      }).join("")}
    </div>
    ${!s.checked?`<div id="bank" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:40px">${s.bank.map(c=>`<button class="bankc mono" data-k="${c.key}">${esc(c.text)}</button>`).join("")}</div>`:""}
    ${s.checked?`<div style="background:${s.correct?C.successBg:C.errorBg};border:1px solid ${s.correct?C.success:C.error};border-radius:14px;padding:14px;margin-bottom:16px"><div style="font-size:12px;font-weight:800;color:${s.correct?C.success:C.error};margin-bottom:8px">${s.correct?"正解！":"おしい！正しい順はこちら"}</div><div class="mono" style="font-size:15px;line-height:1.6;color:${C.text}">${esc(cur.en)}</div></div>`:""}
    ${!s.checked?bigBtn("checkBtn","答え合わせ"):`<div style="display:flex;gap:10px">${!s.correct?`<button id="retryBtn" class="btn2">↺ もう一度</button>`:""}<button id="nextBtn" class="btn1" style="flex:2">${s.idx+1>=s.cards.length?"終了する":"次へ"} ›</button></div>`}`;
  bindBack();
  if(!s.checked){
    app.querySelectorAll(".bankc").forEach(b=>b.onclick=()=>{ const c=s.bank.find(x=>x.key===b.dataset.k); s.bank=s.bank.filter(x=>x.key!==b.dataset.k); s.slots.push(c); go("sentence",s); });
    app.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{ const c=s.slots.find(x=>x.key===b.dataset.k); s.slots=s.slots.filter(x=>x.key!==b.dataset.k); s.bank.push(c); go("sentence",s); });
    $("#checkBtn").onclick=()=>{ const ok=s.slots.map(x=>x.text).join(" ")===cur.chunks.join(" "); s.checked=true; s.correct=ok; markSentence(cur.en, ok?"known":"later"); go("sentence",s); };
  } else {
    if($("#retryBtn"))$("#retryBtn").onclick=()=>go("sentence",setupCard(s));
    $("#nextBtn").onclick=()=>{ const ni=s.idx+1; if(ni>=s.cards.length){ go("sentence",{started:false,qf:s.qf}); return;} s.idx=ni; go("sentence",setupCard(s)); };
  }
}
function setupCard(s){
  const card=s.cards[s.idx]; const tagged=card.chunks.map((text,i)=>({text,key:String(i)}));
  let sh=shuffle(tagged); if(sh.length>1 && sh.map(x=>x.key).join()===tagged.map(x=>x.key).join()) sh=shuffle(tagged);
  s.bank=sh; s.slots=[]; s.checked=false; s.correct=false; return s;
}

// ============ UI helpers ============
function poolBy(cat){ return !cat||cat==="all"?VOCAB:VOCAB.filter(v=>v.cat===cat); }
function topBar(t){ return `<div style="display:flex;align-items:center;gap:12px;margin:20px 0 16px"><button id="backBtn" class="back">‹</button><div style="font-size:16px;font-weight:700">${t}</div></div>`; }
function bindBack(){ const b=$("#backBtn"); if(b)b.onclick=()=>go("home"); }
function sectionLabel(t){ return `<div style="font-size:12px;color:${C.muted};margin:6px 0 10px">${t}</div>`; }
function chip(id,label,on){ return `<button class="chip ${on?'on':''}" data-cat="${id}">${label}</button>`; }
function chipQ(id,label,on){ return `<button class="chip ${on?'on':''}" data-qf="${esc(id)}">${esc(label)}</button>`; }
function bindChips(s,field){ app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ s[field]=b.dataset.cat; go(view,s); }); }
function bigBtn(id,label){ return `<button id="${id}" class="big">${label}</button>`; }
function statRow(l,r){ return `<div class="mono" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px;color:${C.muted}"><span>${l}</span><span>${r}</span></div>`; }
function resultCard(pct,lines){ return `<div style="background:${C.surface};border:1px solid ${C.border};border-radius:18px;padding:24px;text-align:center;margin-bottom:20px"><div style="font-size:12px;color:${C.muted};letter-spacing:1.5px">セッション終了</div><div class="mono" style="font-size:40px;font-weight:800;margin:8px 0;color:${C.accent}">${pct}%</div>${lines.map(l=>`<div style="font-size:13px;color:${C.muted}">${l}</div>`).join("")}</div>`; }

load(); render();

</script>
</body>
</html>
